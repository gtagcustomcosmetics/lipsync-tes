<title>Character Lip Sync</title>
<style>
  html, body { margin: 0; min-height: 100%; background: #1b1f2a; color: #eee; font-family: system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px 0 24px; box-sizing: border-box; min-height: 100vh; }
  #stage { position: relative; width: min(88vw, 62vh); aspect-ratio: 1 / 1; }
  #stage img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  #faceLayer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  #faceLayer img { will-change: transform, opacity; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button { font-size: 16px; padding: 12px 22px; border: 2px solid #ffd23f; border-radius: 999px; background: transparent; color: #ffd23f; font-weight: 700; }
  button.on { background: #ffd23f; color: #222; }
  label { font-size: 14px; opacity: .85; display: flex; gap: 10px; align-items: center; }
  #msg { font-size: 14px; opacity: .7; min-height: 1.2em; text-align: center; padding: 0 20px; }
  details { font-size: 14px; opacity: .9; }
  summary { cursor: pointer; text-align: center; opacity: .8; }
  details .row { margin-top: 8px; flex-direction: column; align-items: flex-start; }
  #preview { position: fixed; top: 10px; right: 10px; width: 110px; border-radius: 10px; border: 2px solid #ffd23f; transform: scaleX(-1); display: none; }
</style>

<div class="row">
  <button id="micBtn">🎤 Mic</button>
  <button id="faceBtn">📷 Face tracking</button>
</div>
<div class="row" style="font-size:13px; opacity:.7">Turn on both for the most accurate mouth.</div>
<label id="sensWrap" style="display:none">Mic sensitivity <input id="sens" type="range" min="1" max="10" step="0.5" value="5"></label>
<div id="faceWrap" class="row" style="display:none">
  <label>Open threshold <input id="dead" type="range" min="0" max="0.3" step="0.01" value="0.12"></label>
  <button id="calBtn" style="font-size:14px; padding:8px 16px">Set neutral</button>
</div>
<details>
  <summary>Face position &amp; size</summary>
  <div class="row">
    <label>Left / right <input id="posX" type="range" min="-300" max="300" step="1" value="0"></label>
    <label>Up / down <input id="posY" type="range" min="-300" max="300" step="1" value="0"></label>
    <label>Size <input id="size" type="range" min="0.5" max="1.6" step="0.01" value="1"></label>
    <button id="resetPos" style="font-size:13px; padding:6px 14px">Reset</button>
  </div>
</details>
<div id="msg">Pick a mode to start.</div>

<script>
const $ = id => document.getElementById(id);
const msg = $('msg');
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));

/* ---------- Face placement (sliders, remembered per browser) ---------- */
const faceLayer = $('faceLayer');
function applyPlacement() {
  const x = parseFloat($('posX').value), y = parseFloat($('posY').value), s = parseFloat($('size').value);
  // x / y are in character-image pixels (2048 canvas); the layer scales from the face centre
  faceLayer.style.transformOrigin = '50.659% 54.443%';
  faceLayer.style.transform = `translate(${x / 20.48}%, ${y / 20.48}%) scale(${s})`;
  try { localStorage.setItem('charPlacement', JSON.stringify({ x, y, s })); } catch (e) {}
}
['posX', 'posY', 'size'].forEach(id => $(id).addEventListener('input', applyPlacement));
$('resetPos').addEventListener('click', () => { $('posX').value = 0; $('posY').value = 0; $('size').value = 1; applyPlacement(); });
try {
  const p = JSON.parse(localStorage.getItem('charPlacement') || 'null');
  if (p) { $('posX').value = p.x; $('posY').value = p.y; $('size').value = p.s; }
} catch (e) {}
applyPlacement();

/* ---------- Drawing: continuous mouth ---------- */
// The open mouth is squashed from its top lip (like a jaw dropping), then
// crossfaded into the closed mouth at the very start. Width follows smile / pucker / vowel.
const openImg = $('openImg'), closedImg = $('closedImg');
let o = 0, wd = 0;        // smoothed openness (0..1) and width (-1 pucker .. +1 wide)
function drawMouth(targetO, targetW, dt) {
  // fast attack, softer release, frame-rate independent
  const k = 1 - Math.exp(-dt * (targetO > o ? 28 : 16));
  o += (targetO - o) * k;
  wd += (targetW - wd) * (1 - Math.exp(-dt * 14));
  const ease = Math.pow(clamp(o), 0.85);
  const sy = 0.38 + 0.62 * ease;                // vertical squash of the open mouth
  const sxo = (0.88 + 0.12 * ease) * (1 + 0.10 * wd);
  const sxc = 1 + 0.10 * wd;
  const t = clamp(o / 0.16);                    // closed -> open crossfade
  openImg.style.opacity = t;
  closedImg.style.opacity = 1 - t;
  openImg.style.transform = `scale(${sxo}, ${sy})`;
  closedImg.style.transform = `scale(${sxc}, 1)`;
}

/* ---------- State: each input can be on independently ---------- */
let micOn = false, faceOn = false, looping = false;
const micS  = { open: 0, f1n: 0.5, f2n: 0.5 };
const faceS = { jaw: 0, wide: 0, rnd: 0 };

/* ---------- MIC ---------- */
let micStream, audioCtx, analyser, timeBuf, freqBuf, sampleRate;

function bandCentroid(lo, hi) {
  const binHz = sampleRate / analyser.fftSize;
  let num = 0, den = 0;
  for (let i = Math.floor(lo / binHz); i <= Math.ceil(hi / binHz); i++) {
    const p = Math.pow(10, freqBuf[i] / 10);
    num += p * i * binHz; den += p;
  }
  return den > 0 ? num / den : (lo + hi) / 2;
}

function tickMic() {
  analyser.getFloatTimeDomainData(timeBuf);
  let sum = 0;
  for (let i = 0; i < timeBuf.length; i++) sum += timeBuf[i] * timeBuf[i];
  const rms = Math.sqrt(sum / timeBuf.length);
  const target = clamp((rms - 0.008) * parseFloat($('sens').value) * 14);
  micS.open = lerp(micS.open, target, target > micS.open ? 0.5 : 0.25);

  if (target > 0.08) {
    analyser.getFloatFrequencyData(freqBuf);
    const F1 = bandCentroid(250, 900);
    const F2 = bandCentroid(900, 2800);
    micS.f1n = lerp(micS.f1n, clamp((F1 - 350) / 400), 0.25);
    micS.f2n = lerp(micS.f2n, clamp((F2 - 1150) / 1100), 0.25);
  }
}

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  sampleRate = audioCtx.sampleRate;
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.5;
  audioCtx.createMediaStreamSource(micStream).connect(analyser);
  timeBuf = new Float32Array(analyser.fftSize);
  freqBuf = new Float32Array(analyser.frequencyBinCount);
}
function stopMic() {
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  analyser = null;
  micS.open = 0;
}

/* ---------- FACE (MediaPipe, runs on-device) ---------- */
let landmarker, faceStream, lastVideoTime = -1;
const video = $('preview');
let rawJaw = 0, neutralJaw = 0, mouthOpen = false;
let rawWide = 0, neutralWide = 0, rawRound = 0, neutralRound = 0;

async function loadLandmarker() {
  if (landmarker) return;
  msg.textContent = 'Loading face tracker (first time only)...';
  const { FaceLandmarker, FilesetResolver } =
    await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
  const fileset = await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
  landmarker = await FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
      delegate: 'GPU'
    },
    runningMode: 'VIDEO',
    outputFaceBlendshapes: true,
    numFaces: 1
  });
}

function tickFace() {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, performance.now());
  const cats = res.faceBlendshapes && res.faceBlendshapes[0] && res.faceBlendshapes[0].categories;
  if (!cats) return;
  const b = {};
  for (const c of cats) b[c.categoryName] = c.score;

  // Dead zone + hysteresis: slight openings / mouth breathing count as closed
  rawJaw = b.jawOpen || 0;
  const dead = parseFloat($('dead').value);
  const d = rawJaw - neutralJaw;
  if (!mouthOpen && d > dead) mouthOpen = true;
  else if (mouthOpen && d < dead * 0.6) mouthOpen = false;
  const jaw = mouthOpen ? Math.pow(clamp((d - dead * 0.6) / 0.35), 1.3) : 0;
  const smile   = ((b.mouthSmileLeft || 0) + (b.mouthSmileRight || 0)) / 2;
  const stretch = ((b.mouthStretchLeft || 0) + (b.mouthStretchRight || 0)) / 2;
  const round   = clamp((b.mouthFunnel || 0) + (b.mouthPucker || 0));
  rawWide = smile + stretch; rawRound = round;
  const wide = clamp((rawWide - neutralWide - 0.3) / 0.5);
  const rnd  = clamp((rawRound - neutralRound - 0.3) / 0.5);

  faceS.jaw  = lerp(faceS.jaw,  jaw,  0.5);
  faceS.wide = lerp(faceS.wide, wide, 0.5);
  faceS.rnd  = lerp(faceS.rnd,  rnd,  0.5);
}

async function startFace() {
  await loadLandmarker();
  faceStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: 640, height: 480 }, audio: false
  });
  video.srcObject = faceStream;
  await video.play();
  video.style.display = 'block';
  lastVideoTime = -1;
}
function stopFace() {
  if (faceStream) { faceStream.getTracks().forEach(t => t.stop()); faceStream = null; }
  video.srcObject = null;
  video.style.display = 'none';
  faceS.jaw = faceS.wide = faceS.rnd = 0;
  mouthOpen = false;
}

/* ---------- Combine mic + face ---------- */
let lastT = performance.now();
function render() {
  const now = performance.now();
  const dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;

  const faceO = faceOn ? faceS.jaw * 1.3 : 0;                       // camera: jaw
  const micO  = micOn ? micS.open * lerp(0.8, 1.4, micS.f1n) : 0;   // mic: speech
  const targetO = clamp(Math.max(faceO, micO));

  let w = 0;
  if (faceOn) w += faceS.wide - 1.5 * faceS.rnd;
  if (micOn) w += (micS.f2n - 0.5) * 2 * clamp(micS.open * 2) * (faceOn ? 0.5 : 1);
  drawMouth(targetO, clamp(w, -1, 1), dt);
}

function loop() {
  if (micOn && analyser) tickMic();
  if (faceOn) tickFace();
  render();
  requestAnimationFrame(loop);
}

/* ---------- Buttons ---------- */
function refreshUI() {
  $('micBtn').classList.toggle('on', micOn);
  $('faceBtn').classList.toggle('on', faceOn);
  $('sensWrap').style.display = micOn ? 'flex' : 'none';
  $('faceWrap').style.display = faceOn ? 'flex' : 'none';
  msg.textContent =
    micOn && faceOn ? 'Mic + face on: the camera and mic both drive the mouth.' :
    micOn ? 'Mic on. Talk and the mouth opens.' :
    faceOn ? 'Face tracking on. Your video stays on your device.' :
    'Pick a mode to start.';
}

async function toggle(kind) {
  try {
    if (kind === 'mic') {
      if (micOn) { stopMic(); micOn = false; } else { await startMic(); micOn = true; }
    } else {
      if (faceOn) { stopFace(); faceOn = false; } else { await startFace(); faceOn = true; }
    }
    refreshUI();
    if (!looping) { looping = true; loop(); }
  } catch (err) {
    msg.textContent = 'Could not start: ' + err.message + ' (needs https or localhost, and permission)';
  }
}
$('micBtn').addEventListener('click', () => toggle('mic'));
$('faceBtn').addEventListener('click', () => toggle('face'));
$('calBtn').addEventListener('click', () => {
  neutralJaw = rawJaw; neutralWide = rawWide; neutralRound = rawRound;
  msg.textContent = 'Neutral set. That resting face now reads as closed.';
});
</script>
</body>
</html>
