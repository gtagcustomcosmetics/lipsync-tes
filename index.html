<!doctype html>
<html lang="en" data-bg="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Lip Sync</title>
<style>
  html[data-bg="dark"], html[data-bg="dark"] body { background: #1b1f2a; }
  html[data-bg="green"], html[data-bg="green"] body { background: #00b140; }
  html[data-bg="transparent"], html[data-bg="transparent"] body { background: transparent; }
  html, body { margin: 0; min-height: 100%; color: #eee; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; overflow-y: auto; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 10px; padding: 10px 0 24px; box-sizing: border-box; min-height: 100vh; overflow-y: auto; }
  body.clean { padding: 0; }

  #stage { position: relative; height: min(62vh, 130vw); aspect-ratio: 660 / 1024; flex: none; }
  body.clean #stage { height: min(98vh, 150vw); }
  body.half #stage { height: min(60vh, 88vw); aspect-ratio: 1 / 1; }
  body.half.clean #stage { height: min(98vh, 98vw); }
  body.half #bodyFull, body:not(.half) #bodyHalf { display: none; }
  #poseLayer { position: absolute; inset: 0; transform-origin: 50% 100%; will-change: transform; }
  #poseLayer > img { position: absolute; inset: 0; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  #faceLayer, #faceDyn { position: absolute; inset: 0; }
  .face { position: absolute; display: block; user-select: none; -webkit-user-drag: none; }

  #ui { display: flex; flex-direction: column; align-items: center; gap: 10px; width: min(92vw, 560px); }
  body.clean #ui, body.clean #preview { display: none !important; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
  button { font: inherit; font-size: 16px; padding: 11px 22px; border: 2px solid #ffd23f; border-radius: 999px; background: transparent; color: #ffd23f; font-weight: 700; cursor: pointer; }
  button.on { background: #ffd23f; color: #222; }
  button.small { font-size: 13px; padding: 6px 14px; }
  label { font-size: 14px; opacity: .9; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
  label input[type=range] { flex: 1; max-width: 240px; }
  select { font: inherit; font-size: 14px; }
  #msg { font-size: 14px; opacity: .75; min-height: 1.2em; text-align: center; padding: 0 12px; }
  .hint { font-size: 13px; opacity: .65; }
  details { width: 100%; background: rgba(0,0,0,.28); border-radius: 12px; padding: 8px 14px; box-sizing: border-box; }
  details[open] { max-height: 70vh; overflow-y: auto; overscroll-behavior: contain; }
  summary { cursor: pointer; text-align: center; opacity: .9; font-size: 14px; }
  .panel { display: grid; gap: 10px; margin-top: 10px; }
  .panel h4 { margin: 6px 0 0; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; opacity: .6; font-weight: 600; }
  .checks { display: flex; gap: 14px; flex-wrap: wrap; font-size: 14px; }
  .checks label { justify-content: flex-start; gap: 6px; }
  #preview { position: fixed; top: 10px; right: 10px; width: 110px; border-radius: 10px; border: 2px solid #ffd23f; transform: scaleX(-1); display: none; }
</style>
</head>

<div id="ui">
  <div class="row">
    <button id="micBtn">🎤 Mic</button>
    <button id="faceBtn">📷 Face tracking</button>
  </div>
  <div class="hint">Turn on both for the most accurate mouth.</div>
  <div id="msg">Pick a mode to start.</div>

  <details>
    <summary>Settings</summary>
    <div class="panel">
      <div id="micSettings" style="display:none; gap:10px; grid-auto-flow:row">
        <h4>Mic</h4>
        <label>Sensitivity <input id="sens" type="range" min="1" max="10" step="0.5" value="5"></label>
        <div class="checks"><label><input type="checkbox" id="ooChk" checked> Round mouth on "oo" sounds</label></div>
        <label>Round mouth strictness <input id="ooStrict" type="range" min="1" max="10" step="1" value="5"></label>
      </div>
      <div id="faceSettings" style="display:none; gap:10px; grid-auto-flow:row">
        <h4>Camera</h4>
        <label>Open threshold <input id="dead" type="range" min="0" max="0.3" step="0.01" value="0.12"></label>
        <label>Head movement <input id="headAmt" type="range" min="0" max="2" step="0.05" value="1"></label>
        <div class="checks">
          <label><input type="checkbox" id="flipX"> Flip left/right</label>
          <label><input type="checkbox" id="flipY"> Flip up/down</label>
          <label><input type="checkbox" id="flipTilt"> Flip tilt</label>
        </div>
        <div class="row"><button id="calBtn" class="small">Set neutral (sit normally, then tap)</button></div>
      </div>

      <h4>Look</h4>
      <label>Speech bounce <input id="bounce" type="range" min="0" max="2" step="0.05" value="1"></label>
      <label>Character view
        <select id="viewSel">
          <option value="full">Full body</option>
          <option value="half">Half body</option>
        </select>
      </label>
      <label>Background
        <select id="bgSel">
          <option value="dark">Dark</option>
          <option value="green">Green (for chroma key)</option>
          <option value="transparent">Transparent (OBS browser source)</option>
        </select>
      </label>

      <h4>Face position &amp; size</h4>
      <label>Left / right <input id="posX" type="range" min="-300" max="300" step="1" value="0"></label>
      <label>Up / down <input id="posY" type="range" min="-300" max="300" step="1" value="0"></label>
      <label>Size <input id="size" type="range" min="0.5" max="1.6" step="0.01" value="1"></label>
      <div class="row">
        <button id="resetPos" class="small">Reset position</button>
        <button id="hideBtn" class="small">Hide controls (Esc or H)</button>
      </div>
    </div>
  </details>
</div>

<script>
const $ = id => document.getElementById(id);
const msg = $('msg');
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const DEG = 180 / Math.PI;

/* ---------- Settings (remembered in this browser) ---------- */
const KEY = 'lipsyncSettings_v2';
const FIELDS = ['sens', 'dead', 'headAmt', 'bounce', 'posX', 'posY', 'size', 'ooStrict'];
const CHECKS = ['flipX', 'flipY', 'flipTilt', 'ooChk'];
function setBg(v) {
  if (!['dark', 'green', 'transparent'].includes(v)) v = 'dark';
  document.documentElement.dataset.bg = v; $('bgSel').value = v;
}
function saveSettings() {
  const o = { bg: document.documentElement.dataset.bg, view: viewName };
  FIELDS.forEach(id => o[id] = $(id).value);
  CHECKS.forEach(id => o[id] = $(id).checked);
  try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
}
function loadSettings() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!o) return;
    FIELDS.forEach(id => { if (o[id] !== undefined) $(id).value = o[id]; });
    CHECKS.forEach(id => { if (o[id] !== undefined) $(id).checked = !!o[id]; });
    if (o.bg) setBg(o.bg);
    if (o.view) setView(o.view);
  } catch (e) {}
}

/* ---------- Views: full body / half body ---------- */
// The face art is defined on the 2048px half-body canvas; each view maps it onto its own canvas
// (the full-body mapping was measured by lining up the heads, hair overlap 99.8%).
const FACE_BOXES = { eyesImg: [887, 817, 1265, 1067], closedImg: [761, 1078, 1329, 1219],
                     openImg: [744, 1078, 1331, 1413], roundImg: [965, 1112, 1176, 1325] };
const FACE_BOX = [744, 817, 1331, 1413];
const VIEWS = {
  full: { W: 660,  H: 1024, S: 0.2944, tx: 28.5, ty: 0.5, lean: 0.25, breath: 0.0015, bob: 0.009, idle: 0.15 },
  half: { W: 2048, H: 2048, S: 1,      tx: 0,    ty: 0,   lean: 0.5,  breath: 0.003,  bob: 0.018, idle: 0.3 }
};
let viewName = 'full', view = VIEWS.full, stageS = 0.6;   // stageS = stage pixels per character-canvas pixel
const faceLayer = $('faceLayer');

function setView(name) {
  if (!VIEWS[name]) name = 'full';
  viewName = name; view = VIEWS[name];
  document.body.classList.toggle('half', name === 'half');
  $('viewSel').value = name;
  const px = x => (x * view.S + view.tx) / view.W * 100, py = y => (y * view.S + view.ty) / view.H * 100;
  for (const id in FACE_BOXES) {
    const b = FACE_BOXES[id], el = $(id);
    el.style.left = px(b[0]) + '%';  el.style.top = py(b[1]) + '%';
    el.style.width = (px(b[2]) - px(b[0])) + '%';  el.style.height = (py(b[3]) - py(b[1])) + '%';
  }
  faceLayer.style.transformOrigin = px((FACE_BOX[0] + FACE_BOX[2]) / 2) + '% ' + py((FACE_BOX[1] + FACE_BOX[3]) / 2) + '%';
  applyPlacement();
  stageS = ($('stage').clientHeight || 600) / view.H;
}
function applyPlacement() {
  const x = parseFloat($('posX').value), y = parseFloat($('posY').value), s = parseFloat($('size').value);
  // slider units are half-body canvas pixels, so the same setting works in both views
  faceLayer.style.transform = `translate(${x * view.S / view.W * 100}%, ${y * view.S / view.H * 100}%) scale(${s})`;
}
FIELDS.concat(CHECKS).forEach(id => $(id).addEventListener('input', () => { applyPlacement(); saveSettings(); }));
$('bgSel').addEventListener('change', e => { setBg(e.target.value); saveSettings(); });
$('viewSel').addEventListener('change', e => { setView(e.target.value); saveSettings(); });
$('resetPos').addEventListener('click', () => { $('posX').value = 0; $('posY').value = 0; $('size').value = 1; applyPlacement(); saveSettings(); });

/* ---------- Clean mode (hide controls for streaming) ---------- */
function toggleClean() { document.body.classList.toggle('clean'); }
$('hideBtn').addEventListener('click', toggleClean);
$('stage').addEventListener('dblclick', toggleClean);
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape' || e.key === 'h' || e.key === 'H') toggleClean();   // hide / show everything except the character
});

loadSettings();
const params = new URLSearchParams(location.search);
if (params.has('bg')) setBg(params.get('bg'));
if (params.has('clean')) document.body.classList.add('clean');
if (params.has('view')) viewName = params.get('view');
setView(viewName);

/* ---------- Drawing ---------- */
const poseLayer = $('poseLayer'), faceDyn = $('faceDyn'), eyesImg = $('eyesImg');
const openImg = $('openImg'), closedImg = $('closedImg'), roundImg = $('roundImg');
new ResizeObserver(() => { stageS = ($('stage').clientHeight || 600) / view.H; }).observe($('stage'));

// Mouth: a spring, so it opens fast, overshoots a hair and settles like a real jaw.
// The round "O" is a morph: the current mouth squeezes down to a small dot, the O grows out of that dot,
// and it plays in reverse on the way back. (Sizes below are in 2048px half-body canvas pixels.)
const MORPH = { dot: [76, 70], closed: [568, 141], open: [587, 335], round: [211, 213], start: [-12, -49.5] };
const smooth = t => t * t * (3 - 2 * t);
let o = 0, ov = 0, wd = 0, rr = 0, isOpen = false, isRound = false;
function drawMouth(targetO, targetW, dt, roundWant = 0) {
  const K = 900, C = 40;
  ov += ((targetO - o) * K - ov * C) * dt;
  o += ov * dt;
  if (o < 0) { o = 0; if (ov < 0) ov = 0; }
  if (o > 1.2) { o = 1.2; if (ov > 0) ov = 0; }
  wd += (targetW - wd) * (1 - Math.exp(-dt * 14));
  rr += (roundWant - rr) * (1 - Math.exp(-dt * (roundWant > rr ? 11 : 14)));   // how "pursed" the mouth is, 0..1

  const ease = Math.pow(clamp(o, 0, 1.12), 0.85);
  const sy = 0.38 + 0.62 * ease;                       // open mouth squashes from the top lip
  const sxo = (0.88 + 0.12 * ease) * (1 + 0.10 * wd);
  const sxc = 1 + 0.10 * wd;

  // Which mouth is on screen (hard swap, with a little hysteresis). The swap happens while the
  // mouth is squeezed down to the same small dot, so it doesn't pop.
  if (!isOpen && o > 0.10) isOpen = true;
  else if (isOpen && o < 0.05) isOpen = false;
  if (!isRound && rr > 0.52) isRound = true;
  else if (isRound && rr < 0.46) isRound = false;
  openImg.style.opacity = (isOpen && !isRound) ? 1 : 0;
  closedImg.style.opacity = (!isOpen && !isRound) ? 1 : 0;
  roundImg.style.opacity = isRound ? 1 : 0;

  // Outgoing mouth: squeeze toward the dot as the pucker forms
  const e = smooth(clamp(rr / 0.5));
  const mxc = lerp(1, MORPH.dot[0] / (MORPH.closed[0] * sxc), e), myc = lerp(1, MORPH.dot[1] / MORPH.closed[1], e);
  const mxo = lerp(1, MORPH.dot[0] / (MORPH.open[0] * sxo), e),   myo = lerp(1, MORPH.dot[1] / (MORPH.open[1] * sy), e);
  closedImg.style.transform = `scale(${sxc * mxc}, ${myc})`;
  openImg.style.transform = `scale(${sxo * mxo}, ${sy * myo})`;

  // Incoming "O": grows from the dot (sitting where the old mouth was) into place
  const q = smooth(clamp((rr - 0.5) / 0.5));
  const grow = lerp(MORPH.dot[0] / MORPH.round[0], 1, q) * lerp(1, 0.8 + 0.4 * clamp(o), q);   // swells a little with volume
  roundImg.style.transform = `translate(${(1 - q) * MORPH.start[0]}%, ${(1 - q) * MORPH.start[1]}%) scale(${grow})`;
}

// Whole character: idle breathing, speech bounce, and (with camera) head movement.
function applyPose(t) {
  const head = parseFloat($('headAmt').value);
  const fx = $('flipX').checked ? -1 : 1, fy = $('flipY').checked ? -1 : 1, fr = $('flipTilt').checked ? -1 : 1;
  const dx = -faceS.yaw * 164 * view.S * head * fx;   // canvas px of face slide per radian
  const dy = faceS.pitch * 123 * view.S * head * fy;
  const lean = -faceS.roll * DEG * view.lean * head * fr;   // degrees (the whole body pivots at the feet)

  const pxX = dx * stageS, pxY = dy * stageS;
  faceDyn.style.transform = `translate(${pxX}px, ${pxY}px)`;
  eyesImg.style.transform = `translate(${pxX * 0.35}px, ${pxY * 0.35}px)`;   // eyes drift a little more: depth

  const breath = Math.sin(t * 1.7) * view.breath;
  const bob = clamp(o) * view.bob * parseFloat($('bounce').value);
  const idleLean = Math.sin(t * 0.9) * view.idle;
  poseLayer.style.transform = `skewX(${lean + idleLean}deg) scaleY(${1 + breath + bob})`;
}

/* ---------- State ---------- */
let micOn = false, faceOn = false;
const micS  = { open: 0, f1n: 0.5, f2n: 0.5, low: 0 };
const faceS = { jaw: 0, wide: 0, rnd: 0, yaw: 0, pitch: 0, roll: 0 };

/* ---------- MIC ---------- */
let micStream, audioCtx, analyser, timeBuf, freqBuf, sampleRate;

function bandCentroid(lo, hi) {
  const binHz = sampleRate / analyser.fftSize;
  let num = 0, den = 0;
  for (let i = Math.floor(lo / binHz); i <= Math.ceil(hi / binHz); i++) {
    const p = Math.pow(10, freqBuf[i] / 10);
    num += p * i * binHz; den += p;
  }
  return den > 0 ? num / den : (lo + hi) / 2;
}

function bandEnergy(lo, hi) {
  const binHz = sampleRate / analyser.fftSize;
  let sum = 0;
  for (let i = Math.floor(lo / binHz); i <= Math.ceil(hi / binHz); i++) sum += Math.pow(10, freqBuf[i] / 10);
  return sum;
}

function tickMic() {
  analyser.getFloatTimeDomainData(timeBuf);
  let sum = 0;
  for (let i = 0; i < timeBuf.length; i++) sum += timeBuf[i] * timeBuf[i];
  const rms = Math.sqrt(sum / timeBuf.length);
  const target = clamp((rms - 0.008) * parseFloat($('sens').value) * 14);
  micS.open = lerp(micS.open, target, target > micS.open ? 0.6 : 0.3);

  if (target > 0.08) {
    analyser.getFloatFrequencyData(freqBuf);
    const F1 = bandCentroid(250, 900), F2 = bandCentroid(900, 2800);
    micS.f1n = lerp(micS.f1n, clamp((F1 - 350) / 400), 0.25);
    micS.f2n = lerp(micS.f2n, clamp((F2 - 1150) / 1100), 0.25);
    // "oo"/"oh" keep nearly all their energy below ~800 Hz; "ah", "ee" and hissy sounds don't
    micS.low = lerp(micS.low, bandEnergy(80, 800) / (bandEnergy(80, 4000) || 1), 0.3);
  }
}

async function startMic() {
  micStream = await navigator.mediaDevices.getUserMedia({
    audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
  });
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  await audioCtx.resume();
  sampleRate = audioCtx.sampleRate;
  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  analyser.smoothingTimeConstant = 0.5;
  audioCtx.createMediaStreamSource(micStream).connect(analyser);
  timeBuf = new Float32Array(analyser.fftSize);
  freqBuf = new Float32Array(analyser.frequencyBinCount);
}
function stopMic() {
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  analyser = null;
  micS.open = 0;
}

/* ---------- FACE (MediaPipe, runs on-device) ---------- */
let landmarker, faceStream, lastVideoTime = -1, lastFaceSeen = 0;
const video = $('preview');
let rawJaw = 0, neutralJaw = 0, mouthOpen = false;
let rawWide = 0, neutralWide = 0, rawRound = 0, neutralRound = 0;
let rawYaw = 0, rawPitch = 0, rawRoll = 0, neutralYaw = 0, neutralPitch = 0, neutralRoll = 0;

async function loadLandmarker() {
  if (landmarker) return;
  msg.textContent = 'Loading face tracker (first time only)...';
  const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { FaceLandmarker, FilesetResolver } = await import(base + '/vision_bundle.mjs');
  const fileset = await FilesetResolver.forVisionTasks(base + '/wasm');
  const make = delegate => FaceLandmarker.createFromOptions(fileset, {
    baseOptions: {
      modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
      delegate
    },
    runningMode: 'VIDEO',
    outputFaceBlendshapes: true,
    outputFacialTransformationMatrixes: true,
    numFaces: 1
  });
  try { landmarker = await make('GPU'); } catch (e) { landmarker = await make('CPU'); }
}

function tickFace() {
  if (!landmarker || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = landmarker.detectForVideo(video, performance.now());
  const cats = res.faceBlendshapes && res.faceBlendshapes[0] && res.faceBlendshapes[0].categories;
  if (!cats) return; // no face this frame (render() relaxes the pose if it stays missing)
  lastFaceSeen = performance.now();
  const b = {};
  for (const c of cats) b[c.categoryName] = c.score;

  // Jaw: dead zone + hysteresis so mouth breathing / slight openings stay closed
  rawJaw = b.jawOpen || 0;
  const dead = parseFloat($('dead').value);
  const d = rawJaw - neutralJaw;
  if (!mouthOpen && d > dead) mouthOpen = true;
  else if (mouthOpen && d < dead * 0.6) mouthOpen = false;
  const jaw = mouthOpen ? Math.pow(clamp((d - dead * 0.6) / 0.35), 1.3) : 0;

  const smile   = ((b.mouthSmileLeft || 0) + (b.mouthSmileRight || 0)) / 2;
  const stretch = ((b.mouthStretchLeft || 0) + (b.mouthStretchRight || 0)) / 2;
  const round   = clamp((b.mouthFunnel || 0) + (b.mouthPucker || 0));
  rawWide = smile + stretch; rawRound = round;
  const wide = clamp((rawWide - neutralWide - 0.3) / 0.5);
  const rnd  = clamp((rawRound - neutralRound - 0.3) / 0.5);

  faceS.jaw  = lerp(faceS.jaw,  jaw,  0.5);
  faceS.wide = lerp(faceS.wide, wide, 0.5);
  faceS.rnd  = lerp(faceS.rnd,  rnd,  0.5);

  // Head pose from the face transform matrix (column-major 4x4)
  const mx = res.facialTransformationMatrixes && res.facialTransformationMatrixes[0];
  if (mx && mx.data) {
    const m = mx.data, n = Math.hypot(m[8], m[9], m[10]) || 1;
    rawYaw   = Math.atan2(m[8], m[10]);
    rawPitch = Math.asin(clamp(-m[9] / n, -1, 1));
    rawRoll  = Math.atan2(m[1], m[5]);
    faceS.yaw   = lerp(faceS.yaw,   clamp(rawYaw   - neutralYaw,   -0.8, 0.8), 0.3);
    faceS.pitch = lerp(faceS.pitch, clamp(rawPitch - neutralPitch, -0.8, 0.8), 0.3);
    faceS.roll  = lerp(faceS.roll,  clamp(rawRoll  - neutralRoll,  -0.8, 0.8), 0.3);
  }
}

async function startFace() {
  await loadLandmarker();
  faceStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: 'user', width: 640, height: 480 }, audio: false
  });
  video.srcObject = faceStream;
  await video.play();
  video.style.display = 'block';
  lastVideoTime = -1;
  lastFaceSeen = performance.now();
}
function stopFace() {
  if (faceStream) { faceStream.getTracks().forEach(t => t.stop()); faceStream = null; }
  video.srcObject = null;
  video.style.display = 'none';
  Object.keys(faceS).forEach(k => faceS[k] = 0);
  mouthOpen = false;
}

/* ---------- Combine mic + face, animate ---------- */
let lastT = 0, ooAcc = 0;
function render(now) {
  const dt = Math.min(0.033, Math.max(0.001, (now - lastT) / 1000)); lastT = now;

  // Face lost for a moment (looked away, left frame): relax to neutral instead of freezing mid-word
  if (faceOn && performance.now() - lastFaceSeen > 400) {
    for (const k of Object.keys(faceS)) faceS[k] *= 0.88;
    mouthOpen = false;
  }

  const faceO = faceOn ? faceS.jaw * 1.3 : 0;                       // camera: jaw
  const micO  = micOn ? micS.open * lerp(0.8, 1.4, micS.f1n) : 0;   // mic: speech
  const targetO = clamp(Math.max(faceO, micO));

  let w = 0;
  if (faceOn) w += faceS.wide - 1.5 * faceS.rnd;
  if (micOn)  w += (micS.f2n - 0.5) * 2 * clamp(micS.open * 2) * (faceOn ? 0.5 : 1);
  let roundWant = 0;
  if (faceOn) roundWant = clamp((faceS.rnd - 0.12) / 0.4);                  // lips pursed on camera
  if (micOn && $('ooChk').checked) {
    // The mic only counts as "oo" if it is loud enough, sounds like oo/oh (low F1, low F2, energy
    // mostly below ~800 Hz) and keeps doing so for a moment. Brief blips and other sounds don't count.
    const L = parseFloat($('ooStrict').value);
    const hold = 0.05 + 0.025 * L, lowNeeded = 0.65 + 0.02 * L;
    const looksLikeOO = micS.open > 0.22 && micS.f2n < 0.25 && micS.f1n < 0.6 && micS.low > lowNeeded
                        && !(faceOn && faceS.wide > 0.3);                   // not while smiling wide
    ooAcc = clamp(ooAcc + (looksLikeOO ? dt : -2 * dt), 0, hold);
    roundWant = Math.max(roundWant, clamp((ooAcc - hold * 0.5) / (hold * 0.5)));
  }
  drawMouth(targetO, clamp(w, -1, 1), dt, roundWant);
  applyPose(now / 1000);
}

function loop(now) {
  if (micOn && analyser) tickMic();
  if (faceOn) tickFace();
  render(now);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- Buttons ---------- */
function refreshUI() {
  $('micBtn').classList.toggle('on', micOn);
  $('faceBtn').classList.toggle('on', faceOn);
  $('micSettings').style.display = micOn ? 'grid' : 'none';
  $('faceSettings').style.display = faceOn ? 'grid' : 'none';
  msg.textContent =
    micOn && faceOn ? 'Mic + face on: the camera and mic both drive the character.' :
    micOn ? 'Mic on. Talk and the mouth moves.' :
    faceOn ? 'Face tracking on. Your video stays on your device.' :
    'Pick a mode to start.';
}

async function toggle(kind) {
  try {
    if (kind === 'mic') {
      if (micOn) { stopMic(); micOn = false; } else { await startMic(); micOn = true; }
    } else {
      if (faceOn) { stopFace(); faceOn = false; } else { await startFace(); faceOn = true; }
    }
    refreshUI();
  } catch (err) {
    msg.textContent = 'Could not start: ' + err.message + ' (needs https or localhost, and permission)';
  }
}
$('micBtn').addEventListener('click', () => toggle('mic'));
$('faceBtn').addEventListener('click', () => toggle('face'));
$('calBtn').addEventListener('click', () => {
  neutralJaw = rawJaw; neutralWide = rawWide; neutralRound = rawRound;
  neutralYaw = rawYaw; neutralPitch = rawPitch; neutralRoll = rawRoll;
  msg.textContent = 'Neutral set. Your current resting face and head position now read as the default.';
});
</script>
</body>
</html>
